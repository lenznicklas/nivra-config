# Fortress / Sunset — shared palette and typography with Quickshell.
# The starter resolves these three defaults at lock time. Direct hyprlock remains usable.
$lockMonitor =
$lockWallpaper = ~/.config/wallpaper.jpg
$lockAvatar = ~/.config/hypr/scripts/avatar.png
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 1800
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn, 1, 1.8, smooth
    animation = fadeOut, 1, 1.2, smooth
    animation = inputFieldColors, 1, 1.5, smooth
    animation = inputFieldDots, 1, 1.2, smooth
    animation = inputFieldWidth, 0
}

background {
    monitor =
    path = $lockWallpaper
    color = rgba(24, 12, 29, 1.0) # theme: bg
    blur_passes = 3
    blur_size = 6
    brightness = 0.70
    contrast = 0.95
    vibrancy = 0.15
    noise = 0.008
}

# Clock and date on every output; login and status only on the selected output.
label {
    monitor =
    text = cmd[update:60000] date +'<b>%H:%M</b>'
    color = rgba(248, 225, 208, 1.0) # theme: text
    font_size = 88
    font_family = $font
    position = 0, 25%
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(24, 12, 29, 0.45)
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d. %B'
    color = rgba(247, 185, 143, 0.82) # theme: accentSoft
    font_size = 15
    font_family = $font
    position = 0, 12%
    halign = center
    valign = center
}

image {
    monitor = $lockMonitor
    path = $lockAvatar
    size = 80
    rounding = -1
    border_size = 2
    border_color = rgba(245, 137, 92, 0.58)
    position = 0, -4%
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(245, 137, 92, 0.14)
}

label {
    monitor = $lockMonitor
    text = $USER
    color = rgba(248, 225, 208, 0.85) # theme: text
    font_size = 14
    font_family = $font
    position = 0, -17%
    halign = center
    valign = center
}

input-field {
    monitor = $lockMonitor
    size = 340, 52
    position = 0, -29%
    halign = center
    valign = center
    outline_thickness = 2
    rounding = 26
    outer_color = rgba(245, 137, 92, 0.48)
    inner_color = rgba(24, 12, 29, 0.72)
    font_color = rgba(248, 225, 208, 1.0)
    check_color = rgba(247, 185, 143, 0.95)
    fail_color = rgba(226, 85, 73, 0.95)
    capslock_color = rgba(247, 185, 143, 0.95)
    dots_size = 0.22
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span size="small" alpha="60%">Enter password</span>
    check_text = <span size="small">Verifying…</span>
    fail_text = <span size="small">Incorrect password</span>
    font_family = $font
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.25)
}

label {
    monitor = $lockMonitor
    text = cmd[update:15000] python3 ~/.config/hypr/scripts/lockscreen.py status
    color = rgba(248, 225, 208, 0.65) # theme: text
    font_size = 12
    font_family = $font
    position = -28, -24
    halign = right
    valign = top
}

# Empty text and transparent cover disappear completely when no player is playing.
image {
    monitor = $lockMonitor
    path = ~/.config/hypr/scripts/transparent.png
    reload_time = 5
    reload_cmd = python3 ~/.config/hypr/scripts/lockscreen.py cover
    size = 56
    rounding = 8
    border_size = 0
    position = 28, 72
    halign = left
    valign = bottom
}

label {
    monitor = $lockMonitor
    text = cmd[update:5000] python3 ~/.config/hypr/scripts/lockscreen.py media
    color = rgba(248, 225, 208, 0.85) # theme: text
    font_size = 12
    font_family = $font
    text_align = left
    position = 100, 76
    halign = left
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
}

label {
    monitor = $lockMonitor
    text = 󰌌  $LAYOUT
    color = rgba(248, 225, 208, 0.55) # theme: text
    font_size = 11
    font_family = $font
    position = 0, 24
    halign = center
    valign = bottom
}
