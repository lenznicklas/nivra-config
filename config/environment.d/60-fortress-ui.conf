# Shared by systemd environment.d and hypr/modules/ui-environment.lua.
# Arch qt6ct also advertises the qt5ct key; verified with both Qt versions.
QT_QPA_PLATFORMTHEME=qt5ct
# Qt5 currently lacks qt5-wayland: keep a working XWayland fallback.
QT_QPA_PLATFORM=wayland;xcb
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24
# Native GTK file dialogs use the host portal where supported.
GTK_USE_PORTAL=1
