# Fortress / Quickshell for Sway
# Add these lines to ~/.config/sway/config (adjust keys if needed).

# Start Fortress. The directory should be installed as:
# ~/.config/quickshell/fortress-sway/
exec_always --no-startup-id qs -c fortress-sway

# Quickshell windows are controlled via IPC on Sway.
bindsym $mod+space exec qs ipc call fortress launcherToggle
bindsym $mod+n exec qs ipc call fortress notesToggle

# Optional lock shortcut. The lock button in the bar also uses swaylock.
bindsym $mod+l exec swaylock
